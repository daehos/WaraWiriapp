services:
  - type: web
    name: warawiriapp
    runtime: node
    buildCommand: cd Frontend && npm install && npm run build && cd ../Backend && npm install
    startCommand: cd Backend && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      # Isi di dashboard Render setelah service dibuat — tempel SELURUH isi
      # Backend/serviceAccountKey.json sebagai nilai variabel ini (jangan di-commit).
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
