name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: Frontend
        run: npm install

      - name: Build
        working-directory: Frontend
        run: npm run build

      # Aturan Firestore harus tayang SEBELUM situs baru (situs baru menulis field
      # penugasan pemandu). Sengaja tanpa continue-on-error: kalau gagal (mis. akun
      # layanan belum punya peran "Firebase Rules Admin"), deploy situs ikut berhenti
      # dan situs lama tetap utuh. Cadangan: tempel firestore.rules di Firebase Console.
      - name: Deploy Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json" \
            npx --yes firebase-tools@15 deploy --only firestore:rules --project warawiriapp-da23e
          rm -f "$RUNNER_TEMP/firebase-sa.json"

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: warawiriapp-da23e
          channelId: live
